services:
  postgres:
    image: postgres:16-alpine
    container_name: school-fees-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_fees}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_fees}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: school-fees-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/school_fees?schema=public
    command: sh -c "npx prisma migrate deploy --schema ./packages/database/prisma/schema.prisma && npx prisma generate --schema ./packages/database/prisma/schema.prisma && npm run dev -w apps/api"
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    image: node:20-alpine
    container_name: school-fees-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    working_dir: /app
    command: npm run dev:web
    volumes:
      - ./:/app
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
